name: 每天自动生成小学 4-5 年级英语语法

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0:00 (北京时间早上 8:00) 自动运行
  workflow_dispatch: # 允许你随时在网页上点击按钮手动运行

jobs:
  run-grammar-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4

      - name: 2. 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安装依赖库
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: 4. 运行语法生成脚本
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python grammar_generator.py

      - name: 5. 自动将最新网页题目数据推送到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update latest quiz json [skip ci]" && git push)
